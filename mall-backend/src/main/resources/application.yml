# ==================== 支付配置 ====================
pay:
  mock:
    # 开发阶段默认开启 Mock, 不依赖真实商户号
    # 上线前把 enabled 改成 false, 然后填下面 wechat 的真实参数
    enabled: true
    success-rate: 100
    delay-ms: 1500
  wechat:
    # ====== 真实微信支付V3参数(上线时填写) ======
    mch-id: ""
    app-id: ""
    api-v3-key: ""
    private-key-path: ""
    cert-serial-no: ""
    # 支付回调通知URL: 必须是 https 公网地址, 微信会 POST 过来
    # 本地开发可以用 ngrok / cpolar 等内网穿透工具临时暴露
    notify-url: "https://your-domain.com/api/payment/wechat/notify"
    refund-notify-url: "https://your-domain.com/api/payment/wechat/refund-notify"
    # APP:原生APP支付  JSAPI:公众号/小程序  H5:微信外H5  NATIVE:扫码
    trade-type: "APP"